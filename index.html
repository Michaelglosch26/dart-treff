<style>:root{--bg:#090d18;--card:rgba(24,31,52,.72);--card2:#1c2440;--card3:#232d4d;--line:rgba(148,163,210,.14);--txt:#f3f1ea;--mut:#8f9abb;--red:#ef4b42;--green:#22b07d;--gold:#f5b83d;--gold2:#ffd27a;--cream:#efe6cf}

body{margin:0;min-height:100vh;color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom));
  background:radial-gradient(900px 500px at 50% -120px,rgba(245,184,61,.13),transparent 70%),radial-gradient(700px 600px at 110% 40%,rgba(34,176,125,.07),transparent 60%),var(--bg);background-attachment:fixed}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:5;
  background:rgba(9,13,24,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header h1{font:800 24px 'Barlow Condensed',sans-serif;letter-spacing:1px;margin:0;flex:1}
header h1 span{color:var(--gold)}

.dot{width:8px;height:8px;border-radius:50%;background:#4a5270;display:inline-block;flex:0 0 auto}
.dot.on{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.18),0 0 10px #3ddc84}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card h2{font:700 13px Inter,sans-serif;letter-spacing:1.6px;margin:0 0 12px;text-transform:uppercase;color:var(--mut)}
button{font:600 15px Inter,sans-serif;border:1px solid transparent;border-radius:14px;padding:12px 14px;background:var(--card2);color:var(--txt);cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s}
button:active{transform:scale(.96)}

select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus{border-color:var(--gold)}

.pl.act{border-color:rgba(245,184,61,.7);background:linear-gradient(135deg,rgba(245,184,61,.14),rgba(24,31,52,.8));box-shadow:0 0 0 1px rgba(245,184,61,.3),0 10px 30px rgba(245,184,61,.12)}
.pl .nm{flex:1;min-width:0}

.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}

svg.board{width:100%;max-width:440px;display:block;margin:0 auto;touch-action:manipulation;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}

.big{font:800 36px 'Barlow Condensed',sans-serif;text-align:center}

.badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:rgba(255,255,255,.07);padding:3px 8px;border-radius:20px;color:var(--mut);vertical-align:middle}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#3ddc84)}

<body>
<header><img src="wappen.png" alt=""><h1>DART<span>·</span>TREFF</h1><span class="dot" id="netDot"></span><span class="muted" id="netTxt">offline</span></header>
<main>
  <section id="vLogin" hidden></section>
  <section id="vHome" hidden></section>
  <section id="vGame" hidden></section>
  <section id="vCalib" hidden></section>
</main>
<script>
/* ================= Grundlagen ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let myCid=LS.get('dt-cid',null); if(!myCid){myCid='c'+Math.random().toString(36).slice(2,10);LS.set('dt-cid',myCid);}
let myName=LS.get('dt-name','');
function toast(t,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}

/* ================= Board-Geometrie (mm) ================= */
const SEG=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const R={bi:6.35,bo:15.9,ti:99,to:107,di:162,dO:170};
function mk(n,m){return {n,m,v:n*m,l:n===0?'Miss':n===25?(m===2?'Bull':'25'):(m===3?'T':m===2?'D':'')+n};}
function scoreAt(x,y){ // y nach oben
  const r=Math.hypot(x,y); let d;
  if(r>R.dO) d=mk(0,0);
  else if(r<=R.bi) d=mk(25,2);
  else if(r<=R.bo) d=mk(25,1);
  else{ let a=Math.atan2(x,y)*180/Math.PI; a=(a+360+9)%360; const n=SEG[Math.floor(a/18)%20];
    d=mk(n,(r>=R.ti&&r<=R.to)?3:(r>=R.di?2:1)); }
  d.x=+x.toFixed(1); d.y=+y.toFixed(1); return d;
}
function posOf(d){
  if(d.x!=null) return [d.x,d.y];
  if(d.n===0) return null; if(d.n===25) return [0,d.m===2?0:11];
  const a=SEG.indexOf(d.n)*18*Math.PI/180, r=d.m===3?103:d.m===2?166:d.m===1?135:0;
  return [r*Math.sin(a), r*Math.cos(a)];
}

/* ================= Spiellogik ================= */
function x01Eval(s,cid,darts){
  const start=s.scores[cid]; let rem=start,bust=false,fin=false; const used=[];
  for(const d of darts){
    if(bust||fin||used.length>=3) break; used.push(d);
    const nr=rem-d.v;
    if(nr<0||(s.doubleOut&&nr===1)){bust=true;break;}
    if(nr===0){ if(!s.doubleOut||d.m===2){fin=true;rem=0;break;} bust=true;break; }
    rem=nr;
  }
  return {rem:bust?start:rem, run:rem, bust, fin, used, closed:bust||fin||used.length>=3, pts:bust?0:start-rem};
}
function atcEval(s,cid,darts){
  let t=s.scores[cid],fin=false; const used=[];
  for(const d of darts){ if(fin||used.length>=3) break; used.push(d);
    const tn=t===21?25:t; if(d.n===tn){t++; if(t>21) fin=true;} }
  return {rem:t,run:t,bust:false,fin,used,closed:fin||used.length>=3,pts:0};
}
const evalVisit=(s,cid,darts)=>s.mode==='x01'?x01Eval(s,cid,darts):atcEval(s,cid,darts);
const modeName=s=>s.mode==='x01'?`${s.start}${s.doubleOut?' Double Out':''}`:'Around the Clock';

function newGame(o){
  return {id:Math.random().toString(36).slice(2,9),mode:o.mode,start:o.start,doubleOut:o.doubleOut,legsToWin:o.legs,
    local:!!o.local,host:myCid,players:o.local?[]:[{cid:myCid,name:myName||'Ich'}],phase:'lobby',cur:0,legStarter:0,
    scores:{},legs:{},stats:{},visit:[],log:[],seq:1,winner:null,msg:''};
}
function initLeg(s,fresh){
  if(fresh){s.legStarter=0;s.legs={};s.stats={};s.log=[];s.winner=null;}
  for(const p of s.players){ s.scores[p.cid]=s.mode==='x01'?s.start:1;
    if(fresh){s.legs[p.cid]=0;s.stats[p.cid]={darts:0,pts:0};} }
  s.cur=s.legStarter%Math.max(1,s.players.length); s.visit=[];
}
const canAct=(s,from)=>s.local||from===s.host||(s.players[s.cur]&&s.players[s.cur].cid===from);
function reduce(s0,a,from){
  const s=clone(s0);
  switch(a.type){
    case 'join': {
      const ex=s.players.find(p=>p.cid===a.cid);
      if(ex){ex.name=String(a.name||ex.name).slice(0,20);}
      else if(s.phase==='lobby'&&s.players.length<6) s.players.push({cid:a.cid,name:String(a.name||'Gast').slice(0,20)});
      else return s0;
      break; }
    case 'shuffle': if(s.phase!=='lobby'||(from!==s.host&&!s.local)) return s0; for(let i=s.players.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s.players[i],s.players[j]]=[s.players[j],s.players[i]];} break;
    case 'leave': if(s.phase!=='lobby') return s0; s.players=s.players.filter(p=>p.cid!==a.cid); break;
    case 'start': if(from!==s.host||!s.players.length) return s0; initLeg(s,true); s.phase='play'; s.msg=`Los geht's – ${s.players[s.cur].name} beginnt`; break;
    case 'visit': {
      if(s.phase!=='play'||!canAct(s,from)) return s0;
      const p=s.players[s.cur]; const ev=evalVisit(s,p.cid,(a.darts||[]).slice(0,3).map(d=>{const o=mk(+d.n,+d.m); if(d.x!=null){o.x=+d.x;o.y=+d.y;} return o;}));
      s.visit=ev.used; break; }
    case 'commit': {
      if(s.phase!=='play'||!canAct(s,from)) return s0;
      const p=s.players[s.cur], ev=evalVisit(s,p.cid,s.visit), n=s.players.length;
      const st=s.stats[p.cid]; st.darts+=ev.fin?ev.used.length:3; st.pts+=ev.pts;
      const txt=ev.used.map(d=>d.l).join(' · ')||'–';
      s.log.unshift(`${p.name}: ${txt}${s.mode==='x01'?(ev.bust?' → BUST':` = ${ev.pts}`):''}`); s.log=s.log.slice(0,10);
      s.scores[p.cid]=ev.rem; s.visit=[];
      if(ev.fin){
        s.legs[p.cid]++;
        if(s.legs[p.cid]>=s.legsToWin){s.phase='done';s.winner=p.cid;s.msg=`🏆 ${p.name} gewinnt!`;}
        else{s.legStarter=(s.legStarter+1)%n; initLeg(s,false); s.msg=`Leg an ${p.name}! Nächstes Leg beginnt ${s.players[s.cur].name}`;}
      } else { s.cur=(s.cur+1)%n; s.msg=''; }
      break; }
    case 'rematch': if(from!==s.host&&!s.local) return s0; initLeg(s,true); s.phase='play'; s.msg='Revanche!'; break;
    default: return s0;
  }
  s.seq=s0.seq+1; return s;
}
function checkout(rem,left){
  if(rem>170||rem<2||left<1) return null;
  const all=[],fins=[];
  for(let n=20;n>=1;n--) all.push(mk(n,3));
  all.push(mk(25,2),mk(25,1));
  for(let n=20;n>=1;n--) all.push(mk(n,1));
  for(let n=20;n>=1;n--){all.push(mk(n,2));fins.push(mk(n,2));}
  fins.unshift(mk(25,2));
  const pref=[20,16,18,10,12,8,14,6,4,2,19,17,15,13,11,9,7,5,3,1];
  fins.sort((a,b)=>(a.n===25?99:pref.indexOf(a.n))-(b.n===25?99:pref.indexOf(b.n)));
  const f1=fins.find(f=>f.v===rem); if(f1) return [f1];
  if(left>=2) for(const f of fins) for(const a of all) if(a.v+f.v===rem) return [a,f];
  if(left>=3) for(const f of fins) for(const a of all) for(const b of all) if(a.v+b.v+f.v===rem) return [a,b,f];
  return null;
}

/* ================= Netzwerk (Live-Raum) ================= */
let room=null,gRoom=null,G=null,peers=[],gPeers=[],undoStack=[],view='home',joining=null,joinTimer=null,hostGoneSince=0;
const isHost=()=>G&&(G.local||G.host===myCid);
function pres(p){ if(!p||typeof p!=='object') return null; if(p.cid) return p;
  for(const k of ['presence','state','data','value']) if(p[k]&&p[k].cid) return p[k];
  for(const k in p){const v=p[k]; if(v&&typeof v==='object'&&v.cid) return v;} return null; }
const arr=l=>Array.isArray(l)?l:Object.values(l||{});
function unwrap(m,key){ if(!m) return null; if(m[key]!==undefined) return m;
  if(m.data&&m.data[key]!==undefined) return m.data; if(m.payload&&m.payload[key]!==undefined) return m.payload; return null; }
function emit(r,t,d){ if(!r) return; try{const p=r.emit(t,d); if(p&&p.catch) p.catch(e=>console.warn('emit',t,e));}catch(e){console.warn(e);} }
function setPresence(r,d){ if(!r) return; try{const p=r.presence(d); if(p&&p.catch) p.catch(()=>{});}catch(e){} }

/* --- Direktverbindung Handy zu Handy (PeerJS/WebRTC) --- */
let GROUP=null; const SLOTS=8;
const net={peer:null,slot:0,conns:{},pres:{},seen:{},pending:{},myPres:{},lobbyCbs:[],subs:{}};
const slotId=i=>`${GROUP}-${i}`;
const slotOf=c=>+String(c.peer).split('-').pop();
function startPeer(){
  if(typeof Peer==='undefined'||!GROUP){renderNet();return;}
  if(net.started) return; net.started=true;
  const pref=LS.get('dt-slot',1); const order=[pref,...Array.from({length:SLOTS},(_,i)=>i+1).filter(i=>i!==pref)];
  let k=0;
  const tryNext=()=>{
    if(k>=order.length){toast('Alle Plätze belegt');return;}
    const s=order[k++]; const p=new Peer(slotId(s),{debug:0});
    p.on('open',()=>{net.peer=p;net.slot=s;LS.set('dt-slot',s);onNetReady(shim);});
    p.on('error',e=>{ if(e.type==='unavailable-id'&&!net.peer){try{p.destroy()}catch(x){} tryNext();}
      else if(e.type!=='peer-unavailable') console.warn('peer',e.type); });
    p.on('connection',c=>setupConn(c));
    p.on('disconnected',()=>{setTimeout(()=>{try{if(!p.destroyed)p.reconnect()}catch(x){}},2000);renderNet();});
  };
  tryNext();
}
function setupConn(c){
  c.on('open',()=>{const sl=slotOf(c),old=net.conns[sl]; net.conns[sl]=c; net.seen[sl]=Date.now(); delete net.pending[sl];
    if(old&&old!==c){try{old.close()}catch(x){}} sendTo(c,{t:'pres',p:net.myPres}); emitLobby();});
  c.on('data',m=>onMsg(c,m));
  c.on('close',()=>{const sl=slotOf(c); if(net.conns[sl]===c){delete net.conns[sl];delete net.pres[sl];emitLobby();emitSubPeers();}});
  c.on('error',()=>{});
}
function sendTo(c,m){try{if(c&&c.open)c.send(m)}catch(e){}}
function sendAll(m){Object.values(net.conns).forEach(c=>sendTo(c,m));}
function scan(){
  if(!net.peer||net.peer.disconnected) return;
  for(let s=net.slot+1;s<=SLOTS;s++){
    if(net.conns[s]&&net.conns[s].open) continue;
    if(net.pending[s]&&net.pending[s]>Date.now()) continue;
    net.pending[s]=Date.now()+15000;
    try{setupConn(net.peer.connect(slotId(s),{reliable:true}));}catch(e){}
  }
}
function onMsg(c,m){
  if(!m||typeof m!=='object') return; const sl=slotOf(c); net.seen[sl]=Date.now();
  if(m.t==='pres'){net.pres[sl]=m.p;emitLobby();emitSubPeers();}
  else if(m.t==='ev'){const sub=net.subs[m.room]; if(sub&&sub.h[m.topic]) sub.h[m.topic].forEach(f=>{try{f(m.data)}catch(e){console.error(e)}});}
}
function lobbyList(){
  const now=Date.now();
  for(const sl in net.pres) if(now-(net.seen[sl]||0)>35000){delete net.pres[sl];}
  return [net.myPres,...Object.values(net.pres)].filter(p=>p&&p.cid);
}
function emitLobby(){const l=lobbyList(); net.lobbyCbs.forEach(f=>f(l));}
function emitSubPeers(){for(const name in net.subs){const s=net.subs[name]; const l=lobbyList().filter(p=>p.room===name).map(p=>({cid:p.cid,name:p.name})); s.pc.forEach(f=>f(l));}}
const shim={
  onPeers(f){net.lobbyCbs.push(f);f(lobbyList());},
  presence(d){net.myPres={...d,room:net.myPres.room||null};sendAll({t:'pres',p:net.myPres});emitLobby();},
  join(name){const s={h:{},pc:[]}; net.subs[name]=s; net.myPres={...net.myPres,room:name}; sendAll({t:'pres',p:net.myPres});
    return {emit(t,d){sendAll({t:'ev',room:name,topic:t,data:d});}, on(t,f){(s.h[t]||(s.h[t]=[])).push(f);}, presence(){},
      onPeers(f){s.pc.push(f);emitSubPeers();},
      leave(){delete net.subs[name]; net.myPres={...net.myPres,room:null}; sendAll({t:'pres',p:net.myPres});}};}
};
let netOn=false;
function initNet(){
  // In der Claude-Vorschau: Live-Raum von Claude nutzen, sonst Direktverbindung (PeerJS)
  if(window.claude&&typeof claude.use==='function'){
    Promise.resolve(claude.use('room')).then(r=>{ if(r) onNetReady(r); else startPeerSoon(); }).catch(startPeerSoon);
    renderNet(); render(); return;
  }
  startPeerSoon(); renderNet(); render();
}
function startPeerSoon(){ if(window.__peerOK) startPeer(); else window.addEventListener('peerready',startPeer,{once:true}); window.addEventListener('online',()=>{if(!net.peer&&window.__peerOK)startPeer();}); }
function onNetReady(r){
  room=r; netOn=true;
  room.onPeers(l=>{peers=(Array.isArray(l)?l:Object.values(l||{})).map(pres).filter(Boolean);renderNet();if(view==='home')renderHome();});
  updatePresence();
  if(r===shim){ scan(); setInterval(scan,8000);
    setInterval(()=>{sendAll({t:'pres',p:net.myPres});emitLobby();emitSubPeers();},10000); }
  setInterval(updatePresence,15000);
  render();
}
function updatePresence(){
  if(!room) return;
  let status='in der Lobby',game=null;
  if(G&&!G.local){ status=G.phase==='lobby'?'wartet auf Mitspieler':G.phase==='play'?'spielt '+modeName(G):'Spiel beendet';
    if(isHost()&&G.phase==='lobby') game={id:G.id,mode:modeName(G),legs:G.legsToWin,n:G.players.length,host:myName}; }
  else if(G&&G.local) status='spielt offline';
  setPresence(room,{cid:myCid,name:myName||'Unbekannt',status,game,t:Date.now()});
}
function renderNet(){ const on=netOn&&room&&(room!==shim||(net.peer&&!net.peer.disconnected)); $('#netDot').className='dot'+(on?' on':''); $('#netTxt').textContent=on?`${peers.length||1} online`:(net.peer?'verbinde…':'offline'); }

function broadcast(){ if(G&&!G.local&&gRoom) emit(gRoom,'state',G); }
function hostApply(a,from){
  if(!G) return;
  if(a.type==='undo'){
    if(!canAct(G,from)) return;
    if(G.visit.length){const s=clone(G);s.visit=s.visit.slice(0,-1);s.seq++;G=s;}
    else if(undoStack.length){const prev=undoStack.pop();prev.seq=G.seq+1;G=prev;}
    else return;
  } else {
    if(a.type==='commit') {undoStack.push(clone(G)); undoStack=undoStack.slice(-15);}
    const ns=reduce(G,a,from); if(ns===G) return; G=ns;
    if(G.local&&(a.type==='commit'||a.type==='start'||a.type==='rematch')){
      if(G.phase==='done') speak(G.msg.replace('🏆','').trim());
      else{const p=G.players[G.cur]; speak(`${p.name} ist dran`+(G.mode==='x01'?`, noch ${G.scores[p.cid]}`:''));}
    }
  }
  broadcast(); render(); updatePresence();
}
function act(a){ if(!G) return; if(isHost()) hostApply(a,myCid); else emit(gRoom,'action',{a,from:myCid}); }

async function openRoom(id){
  gRoom=await room.join('dart-'+id);
  gRoom.on('state',m=>{ const s=unwrap(m,'players'); if(!s) return;
    if(G&&G.id===s.id&&s.seq<=G.seq&&s.host===G.host) return;
    if(!G&&joining!==s.id) return;
    if(G&&G.id!==s.id) return;
    if(s.phase==='closed'){toast('Der Gastgeber hat das Spiel geschlossen');leaveGame(true);return;}
    const wasMine=G&&G.phase==='play'&&G.players[G.cur]?.cid===myCid;
    G=s; joining=null; if(G.host!==myCid) undoStack=[];
    const nowMine=G.phase==='play'&&G.players[G.cur]?.cid===myCid;
    if(nowMine&&!wasMine){try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}
    render(); updatePresence(); });
  gRoom.on('action',m=>{ const x=unwrap(m,'a'); if(x&&G&&G.host===myCid) hostApply(x.a,x.from); });
  gRoom.on('hello',()=>{ if(G&&G.host===myCid) broadcast(); });
  gRoom.onPeers(l=>{gPeers=arr(l).map(pres).filter(Boolean); if(view==='game') renderGame();});
  setPresence(gRoom,{cid:myCid,name:myName});
}
async function createGame(local){
  const o={mode:$('#gMode').value==='atc'?'atc':'x01',start:+($('#gMode').value)||501,doubleOut:$('#gDO').checked,legs:+$('#gLegs').value,local};
  if(!local&&!room){toast('Online nicht verfügbar – spiele lokal');return;}
  if(!local&&!myName){toast('Bitte zuerst deinen Namen eintragen');return;}
  G=newGame(o); undoStack=[]; view='game';
  if(!local){ await openRoom(G.id); broadcast(); }
  render(); updatePresence();
}
async function joinGame(id){
  if(!myName){toast('Bitte zuerst deinen Namen eintragen');return;}
  G=null; joining=id; view='game'; render();
  await openRoom(id);
  let tries=0; clearInterval(joinTimer);
  const tick=()=>{ tries++;
    if(G&&G.players.some(p=>p.cid===myCid)){clearInterval(joinTimer);return;}
    if(tries>12&&!G){clearInterval(joinTimer);toast('Keine Antwort vom Gastgeber');leaveGame(true);return;}
    emit(gRoom,'action',{a:{type:'join',cid:myCid,name:myName},from:myCid}); emit(gRoom,'hello',{cid:myCid}); };
  tick(); joinTimer=setInterval(tick,1500);
}
function leaveGame(silent){
  clearInterval(joinTimer); camStop();
  if(G&&!G.local&&gRoom){
    if(isHost()&&G.phase==='lobby'){const s=clone(G);s.phase='closed';s.seq++;emit(gRoom,'state',s);}
    else if(G.phase==='lobby') emit(gRoom,'action',{a:{type:'leave',cid:myCid},from:myCid});
  }
  try{gRoom&&gRoom.leave&&gRoom.leave();}catch(e){}
  gRoom=null;G=null;joining=null;gPeers=[];undoStack=[];view='home';render();updatePresence();
}
// Host-Übernahme, falls der Gastgeber verschwindet; Host sendet regelmäßig den Stand
setInterval(()=>{
  if(!G||G.local||!gRoom) return;
  if(isHost()){ broadcast(); return; }
  const here=gPeers.map(p=>p.cid);
  if(!here.length||here.includes(G.host)||G.phase==='done'){hostGoneSince=0;return;}
  if(!hostGoneSince) hostGoneSince=Date.now();
  if(Date.now()-hostGoneSince>8000){
    const cand=G.players.map(p=>p.cid).filter(c=>here.includes(c)||c===myCid).sort();
    if(cand[0]===myCid){G=clone(G);G.host=myCid;G.seq++;G.msg='Gastgeber weg – du leitest jetzt das Spiel';hostGoneSince=0;broadcast();render();}
  }
},3000);

function boardSVG(darts){
  const P=(r,a)=>[ (r*Math.sin(a*Math.PI/180)).toFixed(2), (-r*Math.cos(a*Math.PI/180)).toFixed(2) ];
  const sect=(r1,r2,a1,a2,fill)=>{const [x1,y1]=P(r2,a1),[x2,y2]=P(r2,a2),[x3,y3]=P(r1,a2),[x4,y4]=P(r1,a1);
    return `<path d="M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z" fill="${fill}"/>`;};
  let s=`<svg class="board" id="boardSvg" viewBox="-200 -200 400 400"><circle r="200" fill="#111"/>`;
  SEG.forEach((n,i)=>{const a1=i*18-9,a2=i*18+9,dark=i%2===0;
    s+=sect(R.bo,R.ti,a1,a2,dark?'#1a1a1a':'#efe6cf')+sect(R.ti,R.to,a1,a2,dark?'#d23a33':'#1c8f50')+sect(R.to,R.di,a1,a2,dark?'#1a1a1a':'#efe6cf')+sect(R.di,R.dO,a1,a2,dark?'#d23a33':'#1c8f50');
    const [tx,ty]=P(186,i*18); s+=`<text x="${tx}" y="${ty}" fill="#fff" font-size="17" font-family="Barlow Condensed" font-weight="700" text-anchor="middle" dominant-baseline="central">${n}</text>`;});
  s+=`<circle r="${R.bo}" fill="#1c8f50"/><circle r="${R.bi}" fill="#d23a33"/>`;
  (darts||[]).forEach((d,i)=>{const p=posOf(d); if(!p) return; s+=`<circle cx="${p[0]}" cy="${-p[1]}" r="7" fill="#f2c14e" stroke="#000" stroke-width="2"/><text x="${p[0]}" y="${-p[1]}" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="central">${i+1}</text>`;});
  return s+'</svg>';
}

function tipGeo(px,g){
  const w=g.pw, P=[];
  for(const i of px){const q=applyH(g.Hp,i%w+0.5,((i/w)|0)+0.5); if(q[2]<=0||Math.hypot(q[0],q[1])>600) continue; P.push(q);}
  if(P.length<8) return null;
  let mx=0,my=0; for(const p of P){mx+=p[0];my+=p[1];} mx/=P.length; my/=P.length;
  let sxx=0,syy=0,sxy=0; for(const p of P){const dx=p[0]-mx,dy=p[1]-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
  const ang=0.5*Math.atan2(2*sxy,sxx-syy); let ux=Math.cos(ang),uy=Math.sin(ang);
  const ax=mx-g.foot.x, ay=my-g.foot.y;
  const l1=(sxx+syy)/2+Math.sqrt(((sxx-syy)/2)**2+sxy*sxy), l2=(sxx+syy)/2-Math.sqrt(((sxx-syy)/2)**2+sxy*sxy);
  if(Math.sqrt(l1/Math.max(1e-6,l2))<1.8){const n=Math.hypot(ax,ay)||1; ux=ax/n; uy=ay/n;}
  if(ux*ax+uy*ay<0){ux=-ux;uy=-uy;}
  const ts=P.map(p=>(p[0]-mx)*ux+(p[1]-my)*uy).sort((a,b)=>a-b);
  const tmin=ts[Math.min(ts.length-1,Math.floor(ts.length*0.01))];
  let sx=0,sy=0,c=0; for(const p of P){const t=(p[0]-mx)*ux+(p[1]-my)*uy; if(t<=tmin+2.5){sx+=p[0];sy+=p[1];c++;}}
  return {x:sx/c,y:sy/c,ux,uy};
}
// Die dünne Spitze verschwindet oft im Bild: entlang des Pfeils Richtung Kamera weiterverfolgen
function refineTip(t,g,diff){
  let lastX=t.x,lastY=t.y,miss=0;
  for(let k=1;k<=60;k++){
    const bx=t.x-t.ux*0.5*k, by=t.y-t.uy*0.5*k; let best=0;
    for(const o of [-0.6,0,0.6]){ const q=applyH(g.Hpi,bx-t.uy*o,by+t.ux*o); const xi=Math.round(q[0]-0.5), yi=Math.round(q[1]-0.5);
      if(xi<0||yi<0||xi>=g.pw||yi>=g.ph) continue; const v=diff[yi*g.pw+xi]; if(v>best) best=v; }
    if(best>18){lastX=bx;lastY=by;miss=0;} else if(++miss>=3) break;
  }
  return [lastX+t.ux*2,lastY+t.uy*2];
}
// Rückfall ohne Kamerageometrie: dünnes Ende im Bild
function tipThin(px,w){
  let mx=0,my=0; for(const i of px){mx+=i%w;my+=(i/w)|0;} mx/=px.length;my/=px.length;
  let sxx=0,syy=0,sxy=0; for(const i of px){const dx=i%w-mx,dy=((i/w)|0)-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy;}
  const ang=0.5*Math.atan2(2*sxy,sxx-syy), vx=Math.cos(ang), vy=Math.sin(ang);
  let tmin=1e9,tmax=-1e9; const ts=px.map(i=>{const t=(i%w-mx)*vx+(((i/w)|0)-my)*vy; if(t<tmin)tmin=t; if(t>tmax)tmax=t; return t;});
  const L=tmax-tmin||1; let lo=0,hi=0; ts.forEach(t=>{if(t<tmin+L*.2)lo++; else if(t>tmax-L*.2)hi++;});
  const useMin=lo<hi; let tx=0,ty=0,c=0;
  px.forEach((i,k)=>{const t=ts[k]; if(useMin?t<tmin+L*.06:t>tmax-L*.06){tx+=i%w;ty+=(i/w)|0;c++;}});
  return [tx/(c||1),ty/(c||1)];
}
function myTurnState(){
  if(!G||G.phase!=='play') return null;
  const p=G.players[G.cur]; if(!(G.local||p.cid===myCid)) return null;
  return {p,ev:evalVisit(G,p.cid,G.visit)};
}
function drawCamOverlay(g){
  const o=cam.ov, vw=cam.video.videoWidth, vh=cam.video.videoHeight; if(!o) return;
  if(o.width!==vw||o.height!==vh){o.width=vw;o.height=vh;}
  const ctx=o.getContext('2d'); ctx.clearRect(0,0,vw,vh);
  drawOverlay(ctx,g.Hb,'rgba(242,193,78,.35)',Math.max(1,vw/900));
  if(cam.last&&Date.now()-cam.last.t<5000){const [vx,vy]=applyH(g.Hb,cam.last.bx,cam.last.by), r=Math.max(8,vw/110);
    ctx.strokeStyle='#3ddc84';ctx.lineWidth=Math.max(2,vw/400);ctx.beginPath();ctx.arc(vx,vy,r,0,7);ctx.stroke();
    ctx.font=`bold ${Math.round(r*1.6)}px sans-serif`; const tw=ctx.measureText(cam.last.l).width;
    ctx.fillStyle='#000b';ctx.fillRect(vx+r*1.3,vy-r,tw+r,r*2);ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(cam.last.l,vx+r*1.8,vy);}
}
function camTick(){
  const cal=getCalib();
  if(!cam.stream||cam.busy||!cal||!cam.video||!cam.video.videoWidth) return;
  if(Math.abs(cam.video.videoWidth/cam.video.videoHeight-cal.vw/cal.vh)>0.02){setCamStat('Bildformat geändert – Handy gedreht? Neu kalibrieren');return;}
  cam.busy=true;
  try{
    const g=ensureGeo(cal), F=grabROI(g), idx=g.idx;
    drawCamOverlay(g);
    let moving=false;
    if(cam.prev){ let cnt=0,tot=0; for(let k=0;k<idx.length;k+=2){const i=idx[k]; tot++;
        if(Math.abs(F[0][i]-cam.prev[0][i])+Math.abs(F[1][i]-cam.prev[1][i])+Math.abs(F[2][i]-cam.prev[2][i])>45) cnt++;}
      moving=cnt/tot>0.0008; }
    cam.prev=F;
    if(moving){cam.stable=0; setCamStat('Bewegung…'); return;}
    cam.stable++;
    if(!cam.base){ if(cam.stable>=3){cam.base=F; cam.empty=F; setCamStat(myTurnState()?'Bereit – wirf!':'Bereit');} return; }
    if(cam.stable>=3&&cam.stable%4===3) analyze(F,g);
  }catch(e){console.error(e);}
  finally{cam.busy=false;}
}
function diffMask(F,B,g){
  const idx=g.idx, off=[0,0,0]; let m3=0;
  for(let k=0;k<idx.length;k+=3){const i=idx[k]; m3++; for(let c=0;c<3;c++) off[c]+=F[c][i]-B[c][i];}
  for(let c=0;c<3;c++) off[c]/=m3||1;
  const n=g.pw*g.ph, bin=new Uint8Array(n), diff=new Float32Array(n); let changed=0;
  for(let k=0;k<idx.length;k++){const i=idx[k]; let m=0; for(let c=0;c<3;c++){const d=Math.abs(F[c][i]-off[c]-B[c][i]); if(d>m)m=d;} diff[i]=m; if(m>30){bin[i]=1;changed++;}}
  return {bin,diff,changed};
}
function analyze(F,g){
  // Pfeile gezogen? Board sieht wieder aus wie vor der Aufnahme
  if(G&&G.visit.length&&cam.empty&&myTurnState()){
    if(diffMask(F,cam.empty,g).changed<g.minA){cam.base=F; act({type:'commit'}); setCamStat('Pfeile gezogen – Aufnahme übernommen ✓'); return;}
  }
  if(!G||!G.visit.length) cam.empty=cam.base;
  const {bin,diff,changed}=diffMask(F,cam.base,g);
  const st=myTurnState();
  if(changed<g.minA){ if(changed<g.minA/2) cam.base=F; setCamStat(st?(st.ev.closed?'Pfeile ziehen…':'Bereit – wirf!'):'Bereit'); return; }
  if(changed>g.idx.length*0.05){ // große Änderung: Pfeile gezogen / Person vor dem Board
    cam.base=F;
    if(st&&G.visit.length){ act({type:'commit'}); setCamStat('Aufnahme übernommen ✓'); }
    else setCamStat('Board neu erfasst');
    return;
  }
  const comps=components(bin,g.pw,g.ph,8);
  if(!comps.length||comps[0].length<g.minA/3){cam.base=F;return;}
  // Teile eines Pfeils (z. B. heller Schaft auf hellem Feld) wieder zusammenfügen
  const cen=px=>{let x=0,y=0;for(const i of px){x+=i%g.pw;y+=(i/g.pw)|0;}return [x/px.length,y/px.length];};
  const c0=cen(comps[0]), maxD=120*g.pxmm; let all=[];
  for(const px of comps){const c=cen(px); if(Math.hypot(c[0]-c0[0],c[1]-c0[1])<=maxD) all=all.concat(px);}
  if(all.length<g.minA){cam.base=F;return;}
  let bx,by; const tg=tipGeo(all,g);
  if(tg){ [bx,by]=refineTip(tg,g,diff); }
  else { const [tx,ty]=tipThin(all,g.pw); [bx,by]=applyH(g.Hp,tx+0.5,ty+0.5); }
  const d=scoreAt(bx,by);
  cam.base=F; cam.last={bx,by,l:d.l,t:Date.now()};
  if(!st){ setCamStat('Änderung erkannt (nicht dein Zug)'); return; }
  if(st.ev.closed){ setCamStat('Pfeile ziehen…'); return; }
  const darts=[...G.visit,d], ev2=evalVisit(G,st.p.cid,darts);
  act({type:'visit',darts});
  let say=sayDart(d);
  if(ev2.bust) say+='. Bust!'; else if(ev2.fin) say+='. Game shot!'; else if(ev2.closed&&G.mode==='x01') say+=`. ${ev2.pts} Punkte`;
  speak(say); setCamStat('Erkannt: '+d.l+(ev2.closed?' – jetzt Pfeile ziehen':''));
}

/* ================= Zugang mit Passwort ================= */
const IN_CLAUDE=!!(window.claude&&typeof claude.use==='function');
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=u8=>btoa(String.fromCharCode(...u8)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,salt,iter){const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function unseal(u,pw){const k=await kdf(pw,unb64(u.salt),u.iter); return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(u.iv)},k,unb64(u.ct)));}
async function sha256hex(t){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(t)));return [...h].map(x=>x.toString(16).padStart(2,'0')).join('');}
let auth=LS.get('dt-auth',null), roster=null;
async function loadRoster(){ try{const r=await fetch('players.json',{cache:'no-store'}); if(!r.ok) return null; const j=await r.json(); return Array.isArray(j.users)?j:null;}catch(e){return null;} }
async function startApp(){
  if(IN_CLAUDE){ GROUP='dtreff-preview'; view='home'; render(); initNet(); return; }
  if(!window.isSecureContext||!crypto.subtle){ view='login'; renderLogin('Bitte die App über https:// öffnen (GitHub-Pages-Link).'); return; }
  if(auth&&auth.secret){
    GROUP='dt'+(await sha256hex(auth.secret)).slice(0,20); myName=auth.name; LS.set('dt-name',myName);
    view='home'; render(); initNet();
    // Im Hintergrund prüfen, ob der Zugang noch gilt
    roster=await loadRoster();
    if(roster&&!roster.users.some(u=>u.salt===auth.uid)){ logout('Dein Zugang wurde geändert oder entfernt – bitte neu anmelden.'); }
    return;
  }
  view='login'; render();
}
function logout(msg){ LS.set('dt-auth',null); auth=null; try{location.hash='';}catch(e){} if(msg) LS.set('dt-msg',msg); location.reload(); }
async function renderLogin(err){
  const el=$('#vLogin');
  if(!roster) roster=await loadRoster();
  const msg=err||LS.get('dt-msg',''); LS.set('dt-msg','');
  if(!roster||!roster.users.length){
    el.innerHTML=`<div class="hero"><img src="wappen.png" alt=""><div>1. Dartverein Maria Glosberg</div></div>
      <div class="card"><h2>Noch keine Spieler</h2><div class="muted">${msg?esc(msg)+'<br><br>':''}Es wurde noch keine Spielerliste (players.json) hochgeladen oder sie ist gerade nicht erreichbar. Der Verwalter legt sie über die Verwaltungsseite an.</div>
      <button id="retry" style="width:100%;margin-top:12px">Erneut versuchen</button></div>`;
    $('#retry').onclick=()=>{roster=null;renderLogin();}; return;
  }
  el.innerHTML=`<div class="hero"><img src="wappen.png" alt=""><div>1. Dartverein Maria Glosberg</div></div>
    <div class="card"><h2>Anmelden</h2>
      <select id="lgName"><option value="">Wer bist du?</option>${roster.users.map((u,i)=>`<option value="${i}">${esc(u.name)}</option>`).join('')}</select>
      <input id="lgPw" type="password" placeholder="Passwort" autocomplete="current-password" style="margin-top:8px">
      <div class="status bust" id="lgErr" style="font-size:15px;margin-top:8px">${esc(msg)}</div>
      <button class="pri" id="lgBtn" style="width:100%;margin-top:6px">Anmelden</button>
      <div class="muted" style="margin-top:10px">Nur für Mitglieder. Passwort vergessen? Beim Verwalter melden.</div></div>`;
  const last=LS.get('dt-lastuser',null); if(last!=null&&roster.users[last]) $('#lgName').value=String(last);
  const go=async()=>{
    const i=$('#lgName').value, pw=$('#lgPw').value; if(i===''){$('#lgErr').textContent='Bitte deinen Namen wählen';return;}
    if(!pw){$('#lgErr').textContent='Bitte Passwort eingeben';return;}
    $('#lgBtn').disabled=true; $('#lgBtn').textContent='Prüfe…'; $('#lgErr').textContent='';
    const u=roster.users[+i];
    try{
      const secret=await unseal(u,pw);
      auth={name:u.name,uid:u.salt,secret}; LS.set('dt-auth',auth); LS.set('dt-lastuser',+i);
      startApp();
    }catch(e){
      await new Promise(r=>setTimeout(r,800));
      $('#lgErr').textContent='Passwort falsch'; $('#lgBtn').disabled=false; $('#lgBtn').textContent='Anmelden'; $('#lgPw').select();
    }
  };
  $('#lgBtn').onclick=go; $('#lgPw').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ================= Render-Steuerung ================= */
function render(){
  $('#vLogin').hidden=view!=='login'; if(view==='login'){ $('#vHome').hidden=$('#vGame').hidden=$('#vCalib').hidden=true; renderLogin(); return; }
  $('#vHome').hidden=view!=='home'; $('#vGame').hidden=view!=='game'; $('#vCalib').hidden=view!=='calib';
  if(view==='home') renderHome(); else if(view==='game') renderGame(); else renderCalib();
}
startApp();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
